<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCAD Basic Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
        }

        /* Header */
        header {
            background: #252525;
            padding: 15px 25px;
            border-bottom: 2px solid #444;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        /* Toolbar */
        .toolbar {
            background: #333;
            padding: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: #444;
            color: white;
            border: 1px solid #666;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #555;
        }

        /* Main drawing area */
        .drawing-area {
            margin: 20px;
            height: 600px;
            background-color: white;
            border: 3px solid #555;
            position: relative;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Bottom information bar */
        .status {
            background: #252525;
            padding: 10px 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h1>AutoCAD Basic</h1>
    </header>

    <div class="toolbar">
        <button onclick="setTool('line')">📏 Line</button>
        <button onclick="setTool('rectangle')">▭ Rectangle</button>
        <button onclick="setTool('circle')">⭕ Circle</button>
        <button onclick="clearCanvas()">🗑 Clear</button>
    </div>

    <div class="drawing-area">
        <canvas id="drawingCanvas"></canvas>
    </div>

    <div class="status">
        Current Tool: <span id="currentTool">Line</span>
    </div>


    <script>
        const canvas = document.getElementById("drawingCanvas");
        const ctx = canvas.getContext("2d");

        let tool = "line";
        let startX = 0;
        let startY = 0;
        let drawing = false;

        // Set canvas size
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            // Drawing color
            ctx.strokeStyle = "black";
            ctx.lineWidth = 2;
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        // Select tool
        function setTool(selectedTool) {
            tool = selectedTool;
            document.getElementById("currentTool").innerText =
                selectedTool.charAt(0).toUpperCase() + selectedTool.slice(1);
        }

        // Mouse down
        canvas.addEventListener("mousedown", function(event) {
            const rect = canvas.getBoundingClientRect();

            startX = event.clientX - rect.left;
            startY = event.clientY - rect.top;

            drawing = true;
        });

        // Mouse up
        canvas.addEventListener("mouseup", function(event) {
            if (!drawing) return;

            const rect = canvas.getBoundingClientRect();

            let endX = event.clientX - rect.left;
            let endY = event.clientY - rect.top;

            ctx.strokeStyle = "black";
            ctx.lineWidth = 2;

            if (tool === "line") {

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();

            }

            else if (tool === "rectangle") {

                let width = endX - startX;
                let height = endY - startY;

                ctx.strokeRect(
                    startX,
                    startY,
                    width,
                    height
                );

            }

            else if (tool === "circle") {

                let radius = Math.sqrt(
                    Math.pow(endX - startX, 2) +
                    Math.pow(endY - startY, 2)
                );

                ctx.beginPath();
                ctx.arc(
                    startX,
                    startY,
                    radius,
                    0,
                    2 * Math.PI
                );
                ctx.stroke();
            }

            drawing = false;
        });

        // Clear drawing
        function clearCanvas() {
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );
        }
    </script>

</body>
</html>
